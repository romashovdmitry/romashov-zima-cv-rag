# A generic, single database configuration for PostgreSQL.

[alembic]
# Путь к папке со скриптами, env.py и шаблонами миграций
script_location = alembic

# Шаблон имени файлов. Миграции будут создаваться с датой и временем в начале
# (например: 2026_06_28_1545-a1b2c3d4_add_users_table.py)
file_template = %%(year)d_%%(month)02d_%%(day)02d_%%(hour)02d%%(minute)02d-%%(rev)s_%%(slug)s

# Фиксируем часовой пояс UTC, чтобы у всех разработчиков время в миграциях совпадало
timezone = UTC

# Максимальная длина описания (slug) в названии файла миграции
truncate_slug_length = 40

# Добавляет текущую директорию в sys.path, чтобы Alembic видел модули вашего приложения
prepend_syspath = .

# Важно: для PostgreSQL мы НЕ прописываем здесь реальный URL.
# Строка закомментирована, так как адрес будет динамически подставляться 
# внутри файла app/alembic/env.py из ваших BaseSettings (.env)
# sqlalchemy.url = postgresql+asyncpg://user:pass@localhost:5432/dbname


# Конфигурация логирования (вывод в консоль)
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S