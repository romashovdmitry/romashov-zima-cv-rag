version: "3.8"

services:
  fast_api_backend:
    container_name: fast_api_backend
    build:
      context: .
      dockerfile: ./Docker/FastAPI/Dockerfile
    volumes:
          - ./app:/app # Mounts local code so changes reflect immediately
          - ./alembic:/app/alembic # Root-level alembic scripts with env.py
          - ./.env:/app/.env # Expose .env to pydantic-settings inside the container
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=vector_db
      - QDRANT_PORT=6334  # Using high-performance gRPC instead of HTTP
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    command: sh -c "alembic -c /app/alembic.ini upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app"
    depends_on:
      - postgres

  postgres:
    container_name: postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rags}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:v1.18
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API (for dashboard)
      - "6334:6334" # gRPC API (for fast operations from FastAPI)
    volumes:
      # We are intentionally retaining persistent storage for saving vectors.
      - qdrant_data:/qdrant/storage
    environment:
      # Protect the database in production through an environment variable from .env
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    healthcheck:
      # Check port availability via bash. 15 retries ensure 
      # that FastAPI does not crash during the cold start of the heavy vector database.
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' 2>/dev/null && exit 0 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
  qdrant_data:
